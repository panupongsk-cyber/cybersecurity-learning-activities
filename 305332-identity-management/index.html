:root {

  --accent-light: #EFF6FF;

  --warn: #D97706;
  --warn-bg: #FEF3C7;
  --danger: #DC2626;
  --danger-bg: #FEE2E2;
  --safe: #16A34A;
  --safe-bg: #DCFCE7;
  --soft: #F8FAFC;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-card: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {

  background: var(--bg-canvas);
  overflow: hidden;
  font-family: "Inter", "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Leelawadee UI", "Segoe UI", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
#stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1024px;
  height: 768px;
  background: var(--bg);
  transform-origin: center center;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
  border-radius: 4px;
}

/* ---- แถบบน ---- */
#top {
  height: 68px;
  flex: 0 0 68px;
  border-bottom: 2px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  background: var(--soft);
}
#tag {
  font-weight: 800;
  font-size: 20px;
  background: var(--accent);
  color: #fff;
  padding: 4px 12px;
  border-radius: var(--radius-sm);

}
#title {

  font-weight: 700;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  padding: 0 4px;
}
#sceneNav {

  align-items: center;
  gap: 8px;
  margin: 0 auto;
}
.scene-dot {

  height: 10px;
  border-radius: 50%;
  background: var(--line);
  cursor: pointer;
  transition: all 0.2s ease;
}
.scene-dot.active {
  width: 24px;
  border-radius: 6px;
  background: var(--accent);
}
.pill-btn {
  font-size: 17px;
  font-weight: 700;
  border: 2px solid var(--accent);
  color: var(--accent);
  background: #fff;
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.pill-btn:hover { background: var(--accent); color: #fff; }
.pill-btn.active { background: var(--accent); color: #fff; }

/* ---- ส่วนเนื้อหา ---- */
#main {
  flex: 1;
  padding: 24px 38px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
}
h1 { font-size: 42px; line-height: 1.25; margin-bottom: 16px; font-weight: 800; }
h2 { font-size: 32px; line-height: 1.3; margin-bottom: 14px; font-weight: 700; color: var(--ink); }
p, li, td, th { font-size: 26px; line-height: 1.45; }
.small { font-size: 22px; color: var(--muted); }
ul { padding-left: 32px; }
li { margin-bottom: 10px; }
.center { text-align: center; }
.dark {
  background: #0B132B;
  color: #fff;
  justify-content: center;
  align-items: center;
  border-radius: 2px;
}
.dark h1 { color: #fff; }
.big { font-size: 110px; font-weight: 800; color: var(--danger); line-height: 1; letter-spacing: -2px; }
.blink { animation: bl 1s steps(2,end) infinite; }
@keyframes bl { 50% { opacity: .25; } }

/* ---- การ์ดตัวเลือก ---- */
.opt {
  display: flex;
  gap: 16px;
  align-items: center;
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 10px 18px;
  margin-bottom: 10px;
  background: #fff;
  box-shadow: var(--shadow-card);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
}
.opt:hover { border-color: #93C5FD; transform: translateY(-1px); }
.opt .n {
  flex: 0 0 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  background: var(--soft);
  border: 2px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 800;
  color: var(--ink);
}
.opt .lb { flex: 1; font-size: 25px; line-height: 1.35; font-weight: 600; }
.opt .meta {
  font-size: 20px;
  color: var(--muted);
  white-space: nowrap;
  font-weight: 500;
  background: var(--soft);
  padding: 4px 10px;
  border-radius: 6px;
}
.opt.picked { border-color: var(--accent); background: #EFF6FF; }
.opt.picked .n { background: var(--accent); color: #fff; border-color: var(--accent); }
.opt.dead { border-color: #F87171; background: #FEF2F2; opacity: 0.85; }
.opt.dead .n { background: #EF4444; color: #fff; border-color: #DC2626; }
.opt.alive { border-color: #4ADE80; background: #F0FDF4; font-weight: 700; }
.opt.alive .n { background: #22C55E; color: #fff; border-color: #16A34A; }

/* ---- ตาราง ---- */
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: center; font-size: 23px; }
th { background: var(--soft); font-weight: 700; color: var(--ink); }
td.rowh, th.rowh { text-align: left; font-weight: 700; background: #FAFAFA; }
td.cell { cursor: pointer; user-select: none; font-size: 25px; transition: background 0.15s; }
td.cell:hover { background: #E0E7FF; }
td.on { background: #DCFCE7; color: var(--safe); font-weight: 800; }
td.over { background: #FEE2E2; color: var(--danger); font-weight: 800; }
.ok { color: var(--safe); font-weight: 800; }
.no { color: var(--danger); font-weight: 800; }

/* ---- กล่องเน้น (Highlight Boxes) ---- */
.box {
  border-left: 6px solid var(--accent);
  background: var(--accent-light);
  padding: 12px 18px;
  margin-top: 14px;
  font-size: 25px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  line-height: 1.4;
}
.box.w { border-color: var(--warn); background: var(--warn-bg); }
.box.d { border-color: var(--danger); background: var(--danger-bg); }
.box.s { border-color: var(--safe); background: var(--safe-bg); }

/* ---- Passkey Animation (S1b) ---- */
.flow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 18px 0;
  position: relative;
}
.node {
  flex: 0 0 250px;
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px;
  text-align: center;
  background: #fff;
  box-shadow: var(--shadow-card);
  position: relative;
}
.node.highlight-node {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.15);
}
.node .ic { font-size: 54px; line-height: 1.1; }
.node .nm { font-size: 22px; font-weight: 700; margin-top: 4px; }
.node .sub-tag { font-size: 15px; color: var(--muted); font-weight: 500; }
.arrow-container {
  flex: 1;
  text-align: center;
  font-size: 22px;
  color: var(--accent);
  font-weight: 700;
  position: relative;
  padding: 10px 0;
}
.arrow-line {
  height: 6px;
  background: #CBD5E1;
  border-radius: 3px;
  margin-top: 8px;
  position: relative;
  overflow: hidden;
}
.arrow-line-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #3B82F6, #1D4ED8);
  animation: stream 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes stream {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.key {
  display: inline-block;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 22px;
  font-weight: 700;
  margin: 2px 4px;
}
.key.priv { background: var(--danger-bg); color: var(--danger); border: 2px solid var(--danger); }
.key.pub { background: var(--safe-bg); color: var(--safe); border: 2px solid var(--safe); }
.fade { animation: fi .35s ease-out; }
@keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---- แถบล่าง & Touch Controls ---- */
#bot {
  height: 54px;

  border-top: 2px solid var(--line);
  background: var(--soft);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  font-size: 18px;
  color: var(--muted);
  user-select: none;

#bot.hide { display: none; }
.nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;

  padding: 5px 12px;
  border-radius: var(--radius-sm);

.nav-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.nav-btn.primary:hover { background: var(--accent-hover); }

/* ---- โมดัล CSF ---- */
#modal {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.82);
  backdrop-filter: blur(6px);

  align-items: center;
  justify-content: center;
  padding: 50px;
  z-index: 100;
}
#modal.on { display: flex; }
#modal .card {

#modal h2 { color: var(--accent); margin-bottom: 16px; font-size: 28px; }
#modal li { font-size: 23px; margin-bottom: 12px; }
.badge-csf {

  background: var(--accent-light);
  color: var(--accent);
  border: 1px solid #BFDBFE;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 800;
  margin-right: 6px;
}
</style>

     left:{ic:"📱",nm:{th:"อุปกรณ์ของผู้ใช้",en:"User Device"}},
     right:{ic:"🖥️",nm:{th:"เซิร์ฟเวอร์ Club Portal",en:"Club Portal Server"}},
     arrow:{th:"← ส่ง Nonce Challenge สุ่มสด",en:"← Sends random fresh Challenge"},
     bullets:[
      {th:"เซิร์ฟเวอร์สุ่มตัวเลขความยาวสูง เรียกว่า <b>Cryptographic Challenge</b>",en:"The server creates a high-entropy random number called a <b>challenge</b>"},
      {th:"ใช้ได้ <b>ครั้งเดียวแล้วทิ้ง (Replay Protection)</b> ดักซ้ำไม่ได้",en:"It is <b>strictly one-time use</b> — replay attacks are impossible"}]},
    {head:{th:"บีต 3 — เครื่องเซ็นชื่อ: ปลดล็อกด้วยไบโอเมตริก",en:"Beat 3 — Device signs: biometric unlocks key"},
     left:{ic:"👆",nm:{th:"ลายนิ้วมือ / FaceID / PIN",en:"Biometric / PIN"},highlight:true},
     right:{ic:"✍️",nm:{th:"ชิปเซ็นรับรอง (Signature)",en:"Chip Signs Challenge"}},
     arrow:{th:"ส่ง Signature กลับไปยังเซิร์ฟเวอร์ →",en:"Send cryptographic signature back →"},
     bullets:[
      {th:"ลายนิ้วมือหรือใบหน้าทำหน้าที่ <b>ปลดล็อกสิทธิ์ใช้งานกุญแจในเครื่อง</b> — ไม่เคยถูกส่งผ่านเน็ต",en:"Biometrics only <b>authorise local key usage</b> — biometric data never travels over the network"},
      {th:"ส่งกลับเฉพาะ Signature ที่คำนวณจาก Private Key — <b>ไม่มี Shared Secret ให้ดักขโมย</b>",en:"Only the digital signature travels over the wire — <b>zero shared secret to sniff</b>"}]},
    {head:{th:"บีต 4 — เซิร์ฟเวอร์ตรวจรับรอง (Signature Verification)",en:"Beat 4 — Server verifies signature"},
     left:{ic:"✍️",nm:{th:"Signature + Challenge",en:"Signature + Challenge"}},
     right:{ic:"🔓",nm:{th:"ตรวจคู่กับ Public Key",en:"Verify with stored Public Key"}},
     arrow:{th:"ถอดรหัสตรงกัน = ผ่าน ✔",en:"Mathematical match = Authenticated ✔"},
     bullets:[
      {th:"เซิร์ฟเวอร์นำ Public Key ที่บันทึกไว้มาตรวจ — ยืนยันตัวตนสำเร็จโดยไม่มีการส่งรหัสผ่าน",en:"The server verifies the math with the stored public key — login succeeds with zero shared secret"},
      {th:"Challenge ถูกทำลายทิ้งทันที — ผู้ดักฟังนำผลลัพธ์ไปใช้ซ้ำไม่ได้",en:"Challenge is immediately invalidated — complete replay resistance"}]},
    {head:{th:"บีต 5 — ทำไม Phishing ถึงพังพินาศ ⭐",en:"Beat 5 — Why phishing fails completely ⭐"},
     left:{ic:"🎣",nm:{th:"club-portal.co (เว็บปลอม)",en:"club-portal.co (Phishing Site)"}},
     right:{ic:"⛔",nm:{th:"เบราว์เซอร์ปฏิเสธคำขอ",en:"Browser Refuses Challenge"}},
     arrow:{th:"Origin ไม่ตรง — เบราว์เซอร์บล็อกทันที",en:"Origin mismatch — blocked automatically"},
     bullets:[

      {th:"สอดคล้องกับมาตรฐาน <b>NIST SP 800-63B ระดับ AAL3 (Phishing Resistance)</b>",en:"Complies with <b>NIST SP 800-63B AAL3 (Phishing-Resistant Authenticator)</b>"}]}
   ],
   terms:[
    {t:"Asymmetric Cryptography",d:{th:"ระบบกุญแจสาธารณะ-กุญแจส่วนตัว (Public/Private Key)",en:"Public/Private key cryptography for decoupled validation"}},
    {t:"Challenge–Response",d:{th:"พิสูจน์การถือกุญแจลับโดยไม่ต้องส่งกุญแจลับข้ามเครือข่าย",en:"Prove knowledge of a secret without transmitting the secret"}},
    {t:"Origin Binding",d:{th:"credential ผูกติดกับ Domain Name แท้จริง เบราว์เซอร์บล็อกเว็บปลอมเอง",en:"Credential is cryptographically bound to the real domain origin"}},
    {t:"No Shared Secret",d:{th:"ไม่มีรหัสผ่านหรือตัวเลขลับบนเซิร์ฟเวอร์ ฐานข้อมูลหลุดก็ไม่มีความลับให้ใช้",en:"No shared secret stored on the server — server compromise yields no passwords"}},
    {t:"NIST SP 800-63B (AAL3)",d:{th:"เกณฑ์การยืนยันตัวตนระดับสูงสุดที่ทนทานต่อ phishing ทุกรูปแบบ",en:"Highest authentication assurance level with mandatory phishing resistance"}}
   ],
   ask:{th:"ถาม: ลายนิ้วมือถูกส่งเข้าเซิร์ฟเวอร์ไหม? · หากโทรศัพท์หายต้องทำอย่างไร?",en:"Ask: is biometric data sent? · What happens if the device is lost?"} },

/* ============ ENGINE ============ */
const $ = id => document.getElementById(id);
const S = {
  i: 0, step: 0, lang: 'th', pick: {}, rev: {}, all: {}, plan: {}, grid: null, hide: false
};
const T = o => !o ? '' : (o[S.lang] || o.th || '');
const sc = () => CONTENT.scenes[S.i];

function steps(s) {
  switch(s.type) {
    case 'hook': return s.beats.length;
    case 'choice': return 2 + s.replays.length + 1;
    case 'animation': return s.beats.length + 1;
    case 'consent': return 5;
    case 'matrix': return 4;
    case 'order': return 4;
    case 'wrap': return 3;
  }
  return 1;
}

function fit() {
  const k = Math.min(innerWidth / 1024, innerHeight / 768);
  $('stage').style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener('resize', fit);

function save() {
  try { localStorage.setItem('sim01', JSON.stringify({ i: S.i, step: S.step, lang: S.lang })); } catch(e){}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('sim01'));
    if (d) { S.i = d.i || 0; S.step = d.step || 0; S.lang = d.lang || 'th'; }
  } catch(e){}
}

/* ---- Helpers ---- */
function optRow(o, cls, onclickStr) {
  return `<div class="opt ${cls || ''}" ${onclickStr ? `onclick="${onclickStr}"` : ''}>
    <div class="n">${o.n}</div>
    <div class="lb">${T(o.label)}</div>
    ${o.cost ? `<div class="meta">${o.cost} · UX ${'●'.repeat(o.ux)}${'○'.repeat(5-o.ux)}</div>` : ''}
  </div>`;
}

function pickBanner() {
  const p = S.pick[sc().id];
  return p ? `<div class="box"><b>${S.lang === 'th' ? 'ห้องเลือกข้อ' : 'The room chose option'} ${p}</b></div>` : '';
}

function updateSceneDots() {
  const c = $('sceneNav');
  c.innerHTML = CONTENT.scenes.map((s, idx) =>
    `<div class="scene-dot ${idx === S.i ? 'active' : ''}" title="${s.id}: ${T(s.title)}" onclick="goScene(${idx})"></div>`
  ).join('');
}

function updateLabels() {
  $('lblPrev').textContent = S.lang === 'th' ? 'ย้อน' : 'Back';
  $('lblNext').textContent = S.lang === 'th' ? 'ต่อ' : 'Next';
  $('lblReveal').textContent = S.lang === 'th' ? 'เฉลย' : 'Reveal';
  $('lblAll').textContent = S.lang === 'th' ? 'ทุกข้อ' : 'All';
  $('lblSkip').textContent = S.lang === 'th' ? 'ข้ามฉาก' : 'Skip';
}

          </tr>`).join('')}
        </table>
        <div class="box">${S.lang === 'th' ? 'ตาราง NIST CSF 2.0 จะค่อย ๆ ถูกเติมเต็มอย่างต่อเนื่องในทุกบทของวิชา 305332' : 'This map will gradually be populated across all chapters of 305332.'}</div>`;
    } else {
      m.className = 'center';
      h = `<h1 style="font-size:52px">${S.lang === 'th' ? 'สรุปการเรียนรู้บทที่ 2' : 'Chapter 2 Completed'}</h1>
           <div class="box" style="display:inline-block;max-width:85%;text-align:left;font-size:26px">${T(s.close)}</div>`;
    }
  }

  m.innerHTML = h;
  save();
}

/* ---- OPI Calculations ---- */
function opi(g, n) {
  let gr = 0, ov = 0;
  for (let r = 0; r < g.length; r++) {
    for (let c = 0; c < g[r].length; c++) {
      if (g[r][c]) {
        gr++;
        if (!n[r][c]) ov++;
      }
    }
  }
  return { g: gr, opi: gr ? Math.round(ov / gr * 100) : 0 };
}
function liveOPI(s) { return opi(S.grid, s.needed).opi; }
function blast(g, s, roleIdx) {
  const p = [];
  g[roleIdx].forEach((v, c) => { if (v) p.push(T(s.perms[c])); });
  return p.length ? p.join(', ') : (S.lang === 'th' ? 'แทบไม่มีสิทธิ์สำคัญ' : 'Almost nothing');
}
function tog(r, c) {
  S.grid[r][c] = S.grid[r][c] ? 0 : 1;
  render();
}

/* ---- Navigation & User Actions ---- */
function next() {
  if (S.step < steps(sc()) - 1) {
    S.step++;
  } else if (S.i < CONTENT.scenes.length - 1) {
    goScene(S.i + 1);
    return;
  }
  render();
}

function prev() {
  if (S.step > 0) {
    S.step--;
  } else if (S.i > 0) {
    S.i--;
    S.step = steps(sc()) - 1;
  }
  render();
}

function goScene(i) {
  S.i = i;
  S.step = 0;
  S.sceneStart = Date.now();
  if (sc().type === 'matrix') S.grid = null;
  render();
}

function setLang(lang) {
  S.lang = lang;
  document.documentElement.lang = S.lang;
  save();
  render();
}

function toggleLang() {
  setLang(S.lang === 'th' ? 'en' : 'th');
}

function toggleModal() {
  const mo = $('modal');
  if (mo.classList.contains('on')) {
    mo.classList.remove('on');
    return;
  }
  const s = sc();
  $('modalBody').innerHTML = `<h2>NIST CSF 2.0 Mapping — Scene ${s.id}</h2>
    <ul>${s.csf.map(c => `<li><span class="badge-csf">${c}</span> ${T(CSF_DICT[c] || {th:'',en:''})}</li>`).join('') || '<li>ไม่มีหมวดย่อยที่เกี่ยวข้องโดยตรงในฉากนี้</li>'}</ul>
    <p class="small" style="margin-top:16px">${S.lang === 'th' ? 'NIST CSF 2.0 ประกอบด้วย 6 ฟังก์ชันหลักที่ดำเนินงานต่อเนื่องร่วมกัน' : 'NIST CSF 2.0 comprises 6 core functions operating concurrently.'}</p>`;
  mo.classList.add('on');
}

function pickOption(n) {
  S.pick[sc().id] = n;
  render();
}

function pickPlan(n) {
  const s = sc();
  S.pick[s.id] = n;
  if (s.type === 'matrix' && s.plans[n - 1]) {
    S.grid = JSON.parse(JSON.stringify(s.plans[n - 1].grant));
  }
  render();
}

function actionKey(k) {
  const s = sc();
  if (k === 'r') {
    if (s.type === 'choice') S.rev[s.id + '-' + S.step] = 1;
    else if (s.type === 'order') S.rev[S.step === 2 ? s.id + '-d' : s.id] = 1;
    else if (s.type === 'matrix' && S.step < 2) S.step = 2;
    else S.all[s.id] = 1;
    render();
  } else if (k === 'a') {
    S.all[s.id] = 1;
    if (s.type === 'choice') S.step = steps(s) - 1;
    render();
  } else if (k === 's') {
    if (S.i < CONTENT.scenes.length - 1) goScene(S.i + 1);
  }
}

/* ---- Keyboard Listener ---- */
addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft') prev();
  else if ('1234'.includes(k)) {
    const s = sc();
    if (['choice', 'consent', 'matrix'].includes(s.type)) {
      if (s.type === 'matrix') pickPlan(+k);
      else pickOption(+k);
    }
  }
  else if (k === 'r' || k === 'R') actionKey('r');
  else if (k === 'a' || k === 'A') actionKey('a');
  else if (k === 's' || k === 'S') actionKey('s');
  else if (k === 'm' || k === 'M') toggleModal();
  else if (k === 'l' || k === 'L') toggleLang();
  else if (k === 'h' || k === 'H') { S.hide = !S.hide; $('bot').classList.toggle('hide', S.hide); }
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'Home') goScene(0);
});

load(); fit(); render();
</script>
